# Default config for mr60bha2d
# Serial device path (GPIO UART on Pi)
device = "/dev/ttyAMA0"
# Baud rate (factory default: 115200)
baud_rate = 115200
# Unix socket path for client connections
socket_path = "/run/mr60bha2/radar.sock"
# Snapshot emission interval in milliseconds (~8 Hz)
window_ms = 125
# Log level: trace, debug, info, warn, error
log_level = "info"
